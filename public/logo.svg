<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Main gradient: warm earth brown -->
    <linearGradient id="earthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#77574A"/>
      <stop offset="100%" stop-color="#4A3A34"/>
    </linearGradient>
    <!-- Leaf gradient: natural green -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A8C4F"/>
      <stop offset="100%" stop-color="#5A6B38"/>
    </linearGradient>
    <!-- Accent gradient: warm amber -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8743A"/>
      <stop offset="100%" stop-color="#A8836C"/>
    </linearGradient>
    <!-- Glow -->
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#F9F2E4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F9F2E4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#earthGrad)"/>

  <!-- Subtle inner glow -->
  <circle cx="256" cy="256" r="240" fill="url(#glow)"/>

  <!-- Eye/lens outer ring -->
  <ellipse cx="256" cy="248" rx="120" ry="90" fill="none" stroke="#F9F2E4" stroke-width="6" opacity="0.9"/>

  <!-- Eye/lens inner ring -->
  <ellipse cx="256" cy="248" rx="80" ry="60" fill="none" stroke="#F9F2E4" stroke-width="3" opacity="0.5"/>

  <!-- Iris circle -->
  <circle cx="256" cy="248" r="48" fill="url(#accentGrad)" opacity="0.95"/>

  <!-- Pupil -->
  <circle cx="256" cy="248" r="22" fill="#2E2522"/>

  <!-- Pupil highlight -->
  <circle cx="248" cy="240" r="8" fill="#F9F2E4" opacity="0.7"/>
  <circle cx="262" cy="254" r="4" fill="#F9F2E4" opacity="0.4"/>

  <!-- Leaf emerging from top-right of eye -->
  <path d="M 310 170 Q 340 130 370 120 Q 360 160 330 190 Q 320 185 310 170 Z"
        fill="url(#leafGrad)" opacity="0.95"/>

  <!-- Leaf vein -->
  <path d="M 315 175 Q 340 145 365 128"
        fill="none" stroke="#F9F2E4" stroke-width="1.5" opacity="0.5"/>

  <!-- Small leaf accent -->
  <path d="M 295 155 Q 310 135 325 130 Q 318 150 305 165 Q 300 160 295 155 Z"
        fill="url(#leafGrad)" opacity="0.7"/>

  <!-- Sparkle/AI indicator dots -->
  <circle cx="160" cy="190" r="4" fill="#F9F2E4" opacity="0.6"/>
  <circle cx="350" cy="300" r="3" fill="#F9F2E4" opacity="0.4"/>
  <circle cx="175" cy="310" r="3" fill="#F9F2E4" opacity="0.5"/>

  <!-- Bottom text area: "NV" monogram -->
  <text x="256" y="400" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-weight="700"
        font-size="42" fill="#F9F2E4" letter-spacing="6" opacity="0.95">
    NV
  </text>

  <!-- Tagline -->
  <text x="256" y="430" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-weight="500"
        font-size="14" fill="#D0AE92" letter-spacing="3" opacity="0.8">
    NUTRIVISION
  </text>
</svg>
