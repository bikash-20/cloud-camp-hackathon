services:
  - type: web
    name: cloud-camp-hackathon-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r app/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: CORS_ALLOW_ORIGINS
        value: https://cloud-camp-hackathon.vercel.app
      - key: GEMINI_API_KEY
        sync: false
