services:
  - type: web
    name: nutrivision-backend
    env: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt && python3 scripts/download_model.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ANONYMIZED_TELEMETRY
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: JWT_SECRET
        generateValue: true

